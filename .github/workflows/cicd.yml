name: Deploy to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      # Install deps and build Next.js static export
      - name: Install and Build
        run: |
          npm install
          npm run build

      # Deploy via FTP to Hostinger
      - name: Upload to Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.0
        with:
          server: ${{ secrets.HOSTINGER_HOST_FV }}
          username: ${{ secrets.HOSTINGER_USER_FV }}
          password: ${{ secrets.HOSTINGER_KEY_FV }}
          protocol: ftp   # or sftp if Hostinger supports it
          port: 21
          local-dir: ./out/
          server-dir: /public_html/staging/
