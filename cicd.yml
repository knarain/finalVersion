name: Deploy to Hostinger

on:
  push:
    branches:
      - develop

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      # Install deps and build Next.js static export
      - name: Install and Build
        run: |
          npm install
          npm run build
          npm run export

      # Deploy via FTP to Hostinger
      - name: Upload to Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.0
        with:
        server:   ${{ HOSTINGER_HOST_FV }}
        username: ${{ HOSTINGER_USER_FV }}
        password: ${{ HOSTINGER_KEY_FV }}
        protocol: ftp                     # Change from 'ftp' to 'sftp'
        port: 21                            # SFTP default port
        local-dir: ./out
        server-dir: /
