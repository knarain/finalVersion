<!DOCTYPE html>
<html>
<head>
    <title>Create Album Test</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 20px auto; padding: 0 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; }
        input[type="text"], input[type="date"] { width: 100%; padding: 8px; }
        .checkbox-group { margin: 10px 0; }
        button { padding: 10px 20px; background: #007bff; color: white; border: none; cursor: pointer; }
        button:hover { background: #0056b3; }
        #result { margin-top: 20px; padding: 10px; border: 1px solid #ddd; }
    </style>
</head>
<body>
    <h2>Create New Album</h2>
    <form id="albumForm">
        <div class="form-group">
            <label for="clientNames">Client Names:</label>
            <input type="text" id="clientNames" name="clientNames" required>
        </div>

        <div class="form-group">
            <label for="eventType">Event Type:</label>
            <input type="text" id="eventType" name="eventType" required>
        </div>

        <div class="form-group">
            <label for="date">Date:</label>
            <input type="date" id="date" name="date" required>
        </div>

        <div class="form-group">
            <label for="category">Category:</label>
            <input type="text" id="category" name="category" value="wedding" required>
        </div>

        <div class="form-group">
            <label for="coverImage">Cover Image:</label>
            <input type="file" id="coverImage" name="coverImage" accept="image/*">
        </div>

        <div class="checkbox-group">
            <input type="checkbox" id="isLocked" name="isLocked">
            <label for="isLocked">Password Protected?</label>
        </div>

        <div class="form-group" id="passwordGroup" style="display: none;">
            <label for="password">Password:</label>
            <input type="password" id="password" name="password">
        </div>

        <button type="submit">Create Album</button>
    </form>

    <div id="result"></div>

    <script>
        // Show/hide password field based on checkbox
        document.getElementById('isLocked').addEventListener('change', function() {
            document.getElementById('passwordGroup').style.display = this.checked ? 'block' : 'none';
        });

        // Handle form submission
        document.getElementById('albumForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const resultDiv = document.getElementById('result');
            
            try {
                const formData = new FormData(this);
                
                const response = await fetch('/rashmi-backend/gallery/create_album.php', {
                    method: 'POST',
                    body: formData
                });

                const result = await response.json();
                resultDiv.innerHTML = '<pre>' + JSON.stringify(result, null, 2) + '</pre>';
                
                if (result.success) {
                    alert('Album created successfully!');
                    this.reset();
                }
            } catch (error) {
                resultDiv.innerHTML = 'Error: ' + error.message;
            }
        });
    </script>
</body>
</html>
